"updates":
- "directory": "/"
  "labels": []
  "open-pull-requests-limit": 3
  "package-ecosystem": "cargo"
  "schedule":
    "interval": "daily"
    "time": "01:00"
    "timezone": "UTC"
- "commit-message":
    "prefix": "chore:"
  "directory": "/web3.js"
  "labels":
  - "automerge"
  "open-pull-requests-limit": 3
  "package-ecosystem": "npm"
  "schedule":
    "interval": "daily"
    "time": "01:00"
    "timezone": "UTC"
- "commit-message":
    "include": "scope"
    "prefix": "chore:"
  "directory": "/explorer"
  "labels":
  - "automerge"
  "open-pull-requests-limit": 3
  "package-ecosystem": "npm"
  "schedule":
    "interval": "daily"
    "time": "01:00"
    "timezone": "UTC"
"version": 2
